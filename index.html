<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prince Coins</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="//libtl.com/sdk.js" data-zone="11617024" data-sdk="show_11617024"></script>
</head>

<body>
  <h1>👑 Prince Coins</h1>
  <p>Welcome to Prince Coins!</p>

  <button id="watch">🎬 Watch Video</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.getElementById("watch").onclick = function () {
      const userId = tg.initDataUnsafe.user?.id;

      if (!userId) {
        alert("❌ Telegram user not detected.");
        return;
      }

      const ymid = "user_" + userId + "_" + Date.now();

      show_11617024({
        ymid: ymid,
        requestVar: "watch_video"
      }).then(() => {
        alert("🎉 Ad completed!");
      });
    };
  </script>
</body>
</html>
