<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prince Coins</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h1>👑 Prince Coins</h1>
  <p>Welcome to Prince Coins!</p>

  <button id="watch">🎬 Watch Video</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.getElementById("watch").onclick = function () {
      alert("🎬 Rewarded Video will be connected here.");
    };
  </script>
</body>
</html>
